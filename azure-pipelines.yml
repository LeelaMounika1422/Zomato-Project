# Build and push Docker image to Azure Container Registry
# SonarQube analysis + Trivy security scan

trigger:
- master

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'c56f7ef7-6fb7-4bc3-8ffd-6050fbf0f7e8'
  imageRepository: 'leelamounikazomatoproject'
  containerRegistry: 'acproject3demo26.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage

  jobs:
  - job: Build
    displayName: Build

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: SonarQubePrepare@7
      displayName: Prepare SonarQube Analysis
      inputs:
        SonarQube: 'sonarqube-service'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'zomato-project'
        cliProjectName: 'Zomato Project'
        cliSources: '.'

    - task: SonarQubeAnalyze@7
      displayName: Run SonarQube Analysis

    - task: SonarQubePublish@7
      displayName: Publish SonarQube Quality Gate
      inputs:
        pollingTimeoutSec: '300'

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
        trivy --version
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(containerRegistry)/$(imageRepository):$(tag)
      displayName: Trivy Security Scan